<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a { font-family: serif; font-size: 24px; }
        .b { font-style: italic; }
        .c { font-weight: 700; }
        .d { font: italic 700 30px sans-serif; }
    </style>
</head>
<body>
    <p class="a">Normal family and size</p>
    <p class="a b">Italic</p>
    <p class="a c">Bold</p>
    <p class="d">Font shorthand</p>
</body>
</html>
